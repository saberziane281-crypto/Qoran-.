name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Background audio support
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>#' $M
          sed -i 's#</application>#    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>#' $M
          cat > android/app/src/main/java/com/zayan/mushaf/KeepAliveService.java <<'EOF'
          package com.zayan.mushaf;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;

          public class KeepAliveService extends Service {
            @Override
            public IBinder onBind(Intent intent) {
              return null;
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              try {
                String ch = "mushaf_audio";
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  nm.createNotificationChannel(new NotificationChannel(ch, "\u062a\u0634\u063a\u064a\u0644 \u0627\u0644\u062a\u0644\u0627\u0648\u0629", NotificationManager.IMPORTANCE_LOW));
                }
                Intent open = new Intent(this, MainActivity.class);
                open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this, ch) : new Notification.Builder(this);
                b.setContentTitle("\u0645\u0635\u062d\u0641 \u0643\u0631\u064a\u0645");
                b.setContentText("\u0627\u0644\u062a\u0644\u0627\u0648\u0629 \u0642\u064a\u062f \u0627\u0644\u062a\u0634\u063a\u064a\u0644");
                b.setSmallIcon(android.R.drawable.ic_media_play);
                b.setContentIntent(pi);
                b.setOngoing(true);
                Notification n = b.build();
                if (Build.VERSION.SDK_INT >= 29) {
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                } else {
                  startForeground(1, n);
                }
              } catch (Exception e) {
                stopSelf();
              }
              return START_NOT_STICKY;
            }
          }
          EOF
          cat > android/app/src/main/java/com/zayan/mushaf/BgPlugin.java <<'EOF'
          package com.zayan.mushaf;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Bg")
          public class BgPlugin extends Plugin {
            @PluginMethod
            public void start(PluginCall call) {
              try {
                Context c = getContext();
                Intent i = new Intent(c, KeepAliveService.class);
                if (Build.VERSION.SDK_INT >= 26) {
                  c.startForegroundService(i);
                } else {
                  c.startService(i);
                }
              } catch (Exception e) {
              }
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              try {
                getContext().stopService(new Intent(getContext(), KeepAliveService.class));
              } catch (Exception e) {
              }
              call.resolve();
            }
          }
          EOF
          cat > android/app/src/main/java/com/zayan/mushaf/MainActivity.java <<'EOF'
          package com.zayan.mushaf;

          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(BgPlugin.class);
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                      != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[] {"android.permission.POST_NOTIFICATIONS"}, 1);
              }
            }

            @Override
            public void onPause() {
              super.onPause();
              if (getBridge() != null && getBridge().getWebView() != null) {
                getBridge().getWebView().onResume();
                getBridge().getWebView().resumeTimers();
              }
            }
          }
          EOF

      - name: Set app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; p=${s##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${p}x${p} $R/mipmap-$d/$n.png
            done
          done

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-karim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
